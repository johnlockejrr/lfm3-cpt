# Maltese from Korpus Malti (MLRS, University of Malta) and FineWeb-2, built with `lfm3-cpt export`:
#
#   corpora/maltese/<domain>.{train,eval}.jsonl  press_mt, blogs, parliament, umlib_oar, nonfiction, wiki, ...
#   corpora/maltese/fineweb2.{train,eval}.jsonl  FineWeb-2 mlt_Latn web pages
#   corpora/en/fineweb-edu.{train,eval}.jsonl    English replay (from the Hebrew recipe), against forgetting
#   corpora/maltese/pairs.jsonl                  minimal pairs from the held-out Maltese (`lfm3-cpt pairs`)
#
# A directory of its own (not corpora/mt/), so that earlier probe exports can't slip into the globs below.
# Korpus Malti is CC-BY-NC-SA 4.0: fine for research; a model trained on it is not for commercial use.
target_language = "mt"
data_dir = "data/maltese"
output_dir = "runs/lfm3-1.7b-cpt-mt"

[data]
train_files = ["corpora/maltese/*.train.jsonl", "corpora/en/fineweb-edu.train.jsonl"]
eval_files = ["corpora/maltese/*.eval.jsonl"]
# English held out: the "out-of-distribution" row answers "did Maltese training make English worse?"
ood_files = ["corpora/en/fineweb-edu.eval.jsonl"]
file_min_chars = 200
# Apostrophes and hyphens are part of Maltese spelling (ta', il-kelma, għall-ewwel): typographic apostrophes
# are unified with ' so that ta’ and ta' are one word, and the typographic hyphen ‐ with -; nothing
# is removed.
strip_marks = ["typographic_apostrophes", "typographic_hyphens"]
grammar_files = ["corpora/maltese/pairs.jsonl"]

[lora]
# tokenizer-check: 2.09 characters/token, verdict "fair"; the original model barely knows Maltese (perplexity
# 156 on held-out news), so the embeddings are trained too, as for Hebrew.
train_embeddings = true

[training]
num_train_epochs = 1
learning_rate = 1e-4
eval_steps = 250
save_steps = 500
save_total_limit = 4

[sft]
# Stage 2 (chat), as in the final Hebrew recipe (HEBREW.md § 4), built with `lfm3-cpt sft-source`:
#   corpora/sft/mt-alpaca.jsonl       Alpaca with Maltese instructions and only the Maltese answer (saillab TaCo)
#   corpora/sft/opus.{en2mt,mt2en}    real English-Maltese sentence pairs (MLRS/OPUS-MT-EN-Fixed)
#   corpora/sft/en-*.clean.jsonl      English answers from the Hebrew recipe: keep English questions in English
# About 20% English answers in total, the balance that worked best for Hebrew.
sft_dataset = "corpora/sft/mt-alpaca.jsonl"
sft_filter_column = ""
sft_eval_split = ""
sft_eval_holdout = 0.03
sft_mix = [
    "corpora/sft/en-no-robots.clean.jsonl@0.12",
    "corpora/sft/en-gsm8k.clean.jsonl@0.05",
    "corpora/sft/opus.mt2en.jsonl@0.04",
    "corpora/sft/opus.en2mt.jsonl@0.05",
]
