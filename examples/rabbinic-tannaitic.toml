# Tannaitic (Mishnaic) Hebrew on top of the Modern Hebrew model: a second CPT stage (docs/RABBINIC.md).
#
#   corpora/rabbinic/tannaitic.{train,eval}.jsonl  Mishnah, Tosefta, halakhic midrashim   (lfm3-cpt sefaria)
#   corpora/rabbinic/replay-he.train.jsonl         a slice of Hebrew Wikipedia             (keeps Modern Hebrew)
#   corpora/rabbinic/replay-en.train.jsonl         a slice of FineWeb-Edu                  (keeps English)
#   corpora/rabbinic/pairs.jsonl                   word-order / word-choice pairs from held-out tractates
#
# The Tannaitic corpus is small (about 5M characters, 3-4M tokens), so it is repeated (@3) and the replay slices
# are sized from it: roughly half its size in Modern Hebrew and a third in English (docs/RABBINIC.md § 3).
# Start A: the stage-1 Modern Hebrew model (not the chat model). Start B, from the original model, is the same
# config with -s model_id=LiquidAI/LFM3-1.7B -s train_embeddings=true -s output_dir=... (docs/RABBINIC.md § 5).
model_id = "runs/lfm3-1.7b-cpt-he/merged"
target_language = "he"
data_dir = "data/rabbinic"
output_dir = "runs/lfm3-1.7b-cpt-rabbinic"

[data]
train_files = [
    "corpora/rabbinic/tannaitic.train.jsonl@3",
    "corpora/rabbinic/replay-he.train.jsonl",
    "corpora/rabbinic/replay-en.train.jsonl",
]
eval_files = ["corpora/rabbinic/tannaitic.eval.jsonl"]
# Out-of-distribution: held-out Modern Hebrew. The question this row answers is "did the Mishnah push out
# Modern Hebrew?". Score other sets (responsa, English) separately with `evaluate -s ood_files=...`.
ood_files = ["corpora/he/wiki.eval.jsonl"]
file_min_chars = 100            # a short mishnah chapter is a real document
# Vowel points and cantillation are removed so pointed and unpointed editions tokenize the same way; geresh ׳,
# gershayim ״ and maqaf stay (the export already turned ' and " into ׳ and ״).
strip_marks = ["hebrew_cantillation", "hebrew_points"]
grammar_files = ["corpora/rabbinic/pairs.jsonl"]

[lora]
# Start A: the embeddings were trained in stage 1 for the same script, so keep them frozen; with a few million
# tokens, training 262M embedding parameters would mostly overfit. Start B has to train them (-s ...=true).
train_embeddings = false

[training]
num_train_epochs = 1
learning_rate = 1e-4
eval_steps = 100
save_steps = 200
save_total_limit = 3
